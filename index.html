<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Racing Mini Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="game-header">
            <h1>Racing Game</h1>
            <div class="score">Score: <span id="score">0</span></div>
            <div class="speed">Speed: <span id="speed">0</span> mph</div>
        </div>
        
        <div class="game-area" id="gameArea">
            <div class="road">
                <div class="lane-divider"></div>
                <div class="lane-divider"></div>
                <div class="lane-divider"></div>
            </div>
            
            <div class="player-car" id="playerCar"></div>
            
            <div class="obstacles" id="obstacles"></div>
        </div>
        
        <div class="touch-controls" id="touchControls" style="display: none;">
            <div class="steering-controls">
                <button class="touch-btn left-btn" id="leftBtn">◀</button>
                <div class="center-controls">
                    <button class="touch-btn up-btn" id="upBtn">▲</button>
                    <button class="touch-btn down-btn" id="downBtn">▼</button>
                </div>
                <button class="touch-btn right-btn" id="rightBtn">▶</button>
            </div>
            <button class="touch-btn brake-btn" id="brakeBtn">🛑</button>
        </div>
        
        <div class="game-controls">
            <div class="instructions">
                <p class="desktop-instructions">Use ARROW KEYS to steer, SPACE to brake</p>
                <p class="mobile-instructions">Use touch controls below to play</p>
            </div>
            <button id="startBtn" class="start-btn">Start Game</button>
            <button id="pauseBtn" class="pause-btn" style="display: none;">Pause</button>
        </div>
        
        <div class="game-over" id="gameOver" style="display: none;">
            <h2>Game Over!</h2>
            <p>Final Score: <span id="finalScore">0</span></p>
            <button id="restartBtn" class="restart-btn">Play Again</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
